version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: school_attendance_db
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_password_123
      POSTGRES_DB: school_attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
